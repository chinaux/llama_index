name: Unit Testing

on:
  push:
    branches: [ debug-ci ]  #我的debug-ci分支
  workflow_dispatch:				#手动触发（不受分支限制！）

env:
  # How many concurrent processes running pytest in a single CI job
  NUM_WORKERS: 2
  # 默认测试包，可以根据需要修改
  TEST_PACKAGE: "llama-index-integrations/vector_stores/llama-index-vector-stores-zvec"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3

      - name: Run tests for specific package
        shell: bash
        working-directory: llama-dev
        run: |
          uv run -- llama-dev \
            --repo-root ".." '--debug' test \
            --workers ${{ env.NUM_WORKERS }} \
            ${{ env.TEST_PACKAGE }}

      # 备用方案：基于分支比较的测试
