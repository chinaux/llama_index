name: Unit Testing

on:
  push:
    branches: [ debug-ci ]  #我的debug-ci分支
  workflow_dispatch:				#手动触发（不受分支限制！）


env:
  # How many concurrent processes running pytest in a single CI job
  NUM_WORKERS: 2

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests
        shell: bash
        working-directory: llama-dev
        run: |
          # 设置 base-ref：PR 时使用 PR 目标分支，其他情况使用当前分支
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            git fetch origin ${BASE_REF}:${BASE_REF} || true
          else
            BASE_REF="${{ github.ref_name }}"
          fi
          
          uv run -- llama-dev \
            --repo-root ".." ${{ runner.debug && '--debug' || '' }} test \
            --workers ${{ env.NUM_WORKERS }} \
            --base-ref ${BASE_REF}